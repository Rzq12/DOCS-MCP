services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: seirama-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: seirama-document-mcp:latest
    container_name: seirama-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DOCS_ROOT: /app/Docs
      CODEGRAPH_DB: /app/.seirama-data/.codegraph.sqlite
    volumes:
      - ./Docs:/app/Docs:ro
      - mcp_data:/app/.seirama-data

volumes:
  qdrant_data:
  mcp_data: