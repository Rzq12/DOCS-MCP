services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: seirama-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: seirama-document-mcp:latest
    container_name: seirama-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./Docs:/app/Docs:ro
      - mcp_data:/app/.seirama-data

volumes:
  qdrant_data:
  mcp_data: